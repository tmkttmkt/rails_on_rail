    regionType: global
    status: draft
    introducedYear: 1730
    typicalUntilYear: 1840
    regionTags: [britain, north-america]
    profileFamily: strap-rail
    material: wood-wrought-iron-composite
    massKgPerM: 22
    massEvidence: estimated
    referenceMaxAxleLoadT: 2.0
    referenceMaxSpeedKmh: 15
    capabilityEvidence: modeled
    description: >
      木製レールの走行面に薄い鉄板を取り付けた複合レール。
      木材のみより耐摩耗性が高いが、鉄板の浮き・変形・脱落が問題となる。
      北米では19世紀にも安価な鉄道建設方式として使用された。
    sources:
      - britannica-1911-railways
      - nps-allegheny-portage
      - haer-central-georgia


