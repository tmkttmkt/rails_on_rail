  # 番数Nは分岐角θをtan θ = 1/Nで定める。
  # 番数が大きいほど分岐側を高速で通過できるが、全長・用地・価格が増える。
  # 半径と制限速度はゲーム上のトレードオフを成立させるための暫定値であり、
  # 正式な工学値ではない。実測・規格資料による裏付けは今後行う。

