formatVersion: 1
catalog: track-support-systems # 軌道支持方式カタログ

# 締結装置、枕木・支持構造、道床を一体の方式として定義する。
# compatibleProfileFamiliesは使用可能なレール断面系統を表す。

items:
  - id: wooden-wagonway-support
    name: 木製ワゴンウェイ支持方式
    regionType: global
    status: draft
    introducedYear: 1600
    constructionType: timber-integrated
    supportMaterial: wood
    trackBedType: ground
    compatibleProfileFamilies:
      - wooden-edge
      - strap-rail
    description: 木製レールまたは鉄板被覆木製レールを横木・縦木で支える初期方式。
    sources: []

  - id: stone-block-chair-support
    name: 石製ブロック・チェア支持方式
    regionType: europe
    status: draft
    introducedYear: 1760
    constructionType: block-and-chair
    supportMaterial: stone
    trackBedType: ground
    compatibleProfileFamilies:
      - plate-rail
      - l-plate
      - edge-rail
      - fish-belly
      - rolled-fish-belly
    description: 石製ブロックと鋳鉄製チェアなどで短尺レールを点支持する初期軌道方式。
    sources: []

  - id: timber-sleeper-chair-ballast
    name: 木枕木・チェア・バラスト軌道
    regionType: global
    status: draft
    introducedYear: 1830
    constructionType: transverse-sleeper
    supportMaterial: wood
    trackBedType: ballast
    compatibleProfileFamilies:
      - parallel-chair-rail
      - double-head
      - bullhead
      - chair-rail
    description: 木枕木上のチェアとキーで双頭・Bullhead系レールを支持する方式。
    sources: []

  - id: timber-sleeper-direct-ballast
    name: 木枕木・直接締結・バラスト軌道
    regionType: global
    status: draft
    introducedYear: 1830
    constructionType: transverse-sleeper
    supportMaterial: wood
    trackBedType: ballast
    compatibleProfileFamilies:
      - flat-bottom
      - light-flat-bottom
    description: 平底レールを木枕木へ直接固定し、バラストで支持する一般的な方式。
    sources: []

  - id: longitudinal-timber-bridge-support
    name: 縦枕木・ブリッジレール軌道
    regionType: europe
    regionTags: [britain]
    status: draft
    introducedYear: 1838
    constructionType: longitudinal-timber
    supportMaterial: wood
    trackBedType: ballast
    compatibleProfileFamilies:
