    sources: []

  - id: concrete-slab-direct-fixation
    name: コンクリートスラブ・直接締結軌道
    regionType: global
    status: draft
    constructionType: slab
    supportMaterial: reinforced-concrete
    trackBedType: concrete-slab
    compatibleProfileFamilies:
